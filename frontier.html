<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan - Innovación y Emoción</title>
    <!-- Tailwind CSS para el diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
        }
        
    </style>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
</head>
<body class="m-0 p-0 overflow-x-hidden">
    <header class=" w-full top-0 z-50 bg-gradient-to-b text-white py-10 z-50">
        <div class="max-w-[95%] mx-auto px-4 sm:px-6 lg:px-0">
            <div class="flex justify-between items-center h-16">
                
                <!-- Logo Local -->
                <div class="flex-shrink-0 flex items-center cursor-pointer">
                    <img src="nissan-logo-black.svg" alt="Nissan Logo" class="h-20 w-auto object-contain">
                </div>

                <!-- Enlaces de navegación exactos a la imagen -->
                <nav class="hidden md:flex space-x-8 items-center mr-auto ml-[742px]">
                    <a href="#" class="text-black hover:text-gray-300 transition-colors">Comercio</a>
                    <a href="#" class="text-black hover:text-gray-300 transition-colors">Electrificado</a>
                    <a href="#" class="text-black hover:text-gray-300 transition-colors">Propietarios</a>
                    <a href="#" class="text-black hover:text-gray-300 transition-colors">Distribuidores</a>
                    <a href="#" class="group flex items-center bg-white/10 hover:bg-red-600 px-4 py-2 rounded-full border border-gray-400 hover:border-red-600 transition duration-300">                        
                        <!-- Texto: pasa de negro a blanco al hacer hover -->
                        <span class="font-bold text-black group-hover:text-white tracking-wide transition-colors duration-300">Vehículos</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>
    <main>
    <!-- SUB-NAVEGACIÓN (Menú secundario) -->
<div class="w-full bg-white border-b border-gray-200 py-3 px-6 md:px-12 flex items-center justify-between sticky top-0 z-40 shadow-sm">
    
    <!-- Lado Izquierdo: Modelo -->
    <div class="flex flex-col">
        <h2 class="font-black text-lg text-black leading-tight">Sentra® 2027</h2>
        <a href="#" class="text-[11px] font-bold text-gray-500 hover:text-black transition">
            S Cambiar El Acabado <span class="text-black">&or;</span>
        </a>
    </div>

    <!-- Centro: Pestañas (Solo Exterior e Interior) -->
    <nav class="hidden md:flex space-x-12 font-bold text-sm mt-2">
        <!-- Pestaña Activa (Con línea roja) -->
        <a href="#" class="text-black border-b-4 border-[#c3002f] pb-3 px-1">Exterior</a>
        <!-- Pestaña Inactiva -->
        <a href="#" class="text-gray-500 hover:text-black pb-3 px-1 transition-colors">Interior</a>
    </nav>

    <!-- Lado Derecho: Botones de Acción -->
    <div class="hidden lg:flex items-center gap-4">
        <a href="#" class="border border-black rounded-full px-5 py-2.5 text-xs font-bold text-black hover:bg-black hover:text-white transition-colors">
            Contacta Con Un Distribuidor &rarr;
        </a>
    </div>
</div>

<!-- CONTENEDOR PRINCIPAL (Visor 3D y Panel de Color) -->
<div class="flex flex-col lg:flex-row w-full h-[calc(100vh-130px)]">
    
    <!-- COLUMNA IZQUIERDA: Visor de Imagen del Auto -->
    <div class="w-full lg:w-3/4 h-full relative bg-gray-200">
        
        <img src="sentra.webp" alt="Nissan Sentra" class="absolute inset-0 w-full h-full object-cover z-0">

        <!-- 2. Tu modelo 3D flotando y girando encima -->
        <model-viewer 
            src="camioneta-3.glb" 
            alt="Modelo 3D" 
            auto-rotate 
            camera-controls 
            interaction-prompt="none"
            class="absolute inset-0 w-full h-full z-10 bg-transparent">
        </model-viewer>

    </div>

    <!-- COLUMNA DERECHA: Panel de Configurador -->
    <div class="w-full lg:w-1/4 h-full bg-[#f8f8f8] border-l border-gray-200 relative flex flex-col">
        
        <!-- Área scrolleable de opciones -->
        <div class="p-6 md:p-8 overflow-y-auto flex-grow pb-32">
            <h3 class="tracking-widest text-xs font-bold text-gray-800 mb-6 uppercase">Exterior</h3>
            
            <!-- Acordeón de Color -->
            <div class="border-b border-gray-300 pb-4 mb-5">
                <div class="flex justify-between items-center cursor-pointer">
                    <span class="font-bold text-lg text-black">Color exterior</span>
                </div>
            </div>
            
            <p class="font-bold text-sm mb-5 text-black">Estándar</p>
            
            <!-- Lista de Colores -->
            <div class="space-y-4">
                
                <!-- Opción 1: Negro -->
                <label class="flex items-center gap-4 cursor-pointer group">
                    <div class="w-12 h-12 rounded-md bg-[#1a1a1a] shadow-sm border border-gray-300 group-hover:border-gray-500 transition-colors"></div>
                    <span class="text-sm font-medium text-gray-700 group-hover:text-black">Negro Súper</span>
                </label>

                <!-- Opción 2: Gris -->
                <label class="flex items-center gap-4 cursor-pointer group">
                    <div class="w-12 h-12 rounded-md bg-[#5c5c5c] shadow-sm border border-gray-300 group-hover:border-gray-500 transition-colors"></div>
                    <span class="text-sm font-medium text-gray-700 group-hover:text-black">Gris metalizado</span>
                </label>

                <!-- Opción 3: Blanco (Seleccionado) -->
                <label class="flex items-center gap-4 cursor-pointer">
                    <!-- Cuadro de color con estado activo -->
                    <div class="relative w-12 h-12 rounded-md bg-[#e6e6e6] shadow-sm border border-gray-300 ring-2 ring-gray-300 ring-offset-1">
                        <!-- Checkmark Rojo (Símbolo HTML) -->
                        <div class="absolute -top-2 -right-2 w-5 h-5 bg-[#c3002f] rounded-full flex items-center justify-center text-white text-xs font-bold shadow-md">
                            &check;
                        </div>
                    </div>
                    <span class="text-sm font-bold text-black">Azul metalico</span>
                </label>

            </div>
        </div>

        <!-- FOOTER FIJO (Precio y Botón Finalizar) -->
        <div class="absolute bottom-0 left-0 w-full bg-white p-6 border-t border-gray-200 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] flex justify-between items-end z-10">
            <div>
                <p class="text-[10px] text-gray-500 leading-tight mb-1">Precio de venta sugerido<br>por el fabricante (MSRP) total [*]</p>
                <div class="flex items-start">
                    <span class="font-bold text-sm mt-1 mr-1">$</span>
                    <span class="font-black text-2xl text-black">24,135</span>
                </div>
            </div>
            
            <button class="bg-[#c3002f] rounded-full px-5 py-3 text-xs md:text-sm font-bold text-white hover:bg-red-800 transition-colors flex items-center gap-2">
                Finalizar La Construcción <span>&rarr;</span>
            </button>
        </div>

    </div>
</div>
    </main>
</body>
</html>
