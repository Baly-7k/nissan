<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nissan - Innovación y Emoción</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #000;
        }
        .swiper {
            width: 100%;
            height: 100vh;
        }
        .swiper {
            width: 100%;
            height: 100vh;
        }
        .swiper-slide {        
            width: 50%; 
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: all 0.3s ease;
        }
        .swiper-slide:not(.swiper-slide-active) {
            opacity: 0.4;
        }
        .swiper-slide model-viewer {
            pointer-events: none;
        }
        .swiper-slide.swiper-slide-active model-viewer {
            pointer-events: auto;
        }
    </style>
</head>
<body class="m-0 p-0 overflow-x-hidden bg-black">

    <header class="absolute w-full top-0 z-50 bg-gradient-to-b from-black/70 to-transparent text-white py-6">
        <div class="max-w-[95%] mx-auto px-4 flex justify-between items-center h-16">
            <!-- Logo Local -->
            <div class="flex items-center">
                <img src="nissan-logo-white.svg" alt="Nissan Logo" class="h-16 w-auto object-contain">
            </div>
            <nav class="hidden md:flex space-x-8 items-center">                
                <a href="#" class="group flex items-center bg-white/10 hover:bg-red-600 px-4 py-2 rounded-full border border-gray-400 hover:border-red-600 transition duration-300">
                    <span class="font-bold text-white group-hover:text-black tracking-wide transition-colors duration-300">INICIO</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="relative w-full h-screen bg-black flex items-center justify-center">
        
        <div class="swiper mySwiper w-full h-screen px-12">
            <div class="swiper-wrapper flex items-center">
                
                <div class="swiper-slide bg-transparent flex items-center justify-center">
                    <model-viewer src="camioneta-3.glb" alt="Auto 1" auto-rotate camera-controls shadow-intensity="1" class="w-full h-full bg-transparent"></model-viewer>
                </div>

                <div class="swiper-slide bg-transparent flex items-center justify-center">
                    <model-viewer src="camioneta-3.glb" alt="Auto 2" auto-rotate camera-controls shadow-intensity="1" class="w-full h-full bg-transparent"></model-viewer>
                </div>

                <div class="swiper-slide bg-transparent flex items-center justify-center">
                    <model-viewer src="camioneta-3.glb" alt="Auto 3" auto-rotate camera-controls shadow-intensity="1" class="w-full h-full bg-transparent"></model-viewer>
                </div>

            </div>
                <div class="swiper-button-next text-white"></div>
                <div class="swiper-button-prev text-white"></div>
                <div class="swiper-pagination"></div>
        </div>

    </main>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const swiper = new Swiper(".mySwiper", {
                effect: "coverflow", 
                grabCursor: true,
                centeredSlides: true,
                slidesPerView: "auto", 
                loop: true,
                coverflowEffect: {
                    rotate: 0,      
                    stretch: 0,     
                    depth: 200,     
                    modifier: 1,
                    slideShadows: false, 
                },
                pagination: {
                    el: ".swiper-pagination",
                    clickable: true,
                },
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev",
                },
            });
        });
    </script>
</body>
</html>
